name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: gofmt
        run: bash scripts/gofmt-check.sh

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: race test
        run: go test -race ./...

      - name: build
        run: VERSION="ci-${GITHUB_SHA::7}" bash scripts/build.sh

      - name: static check
        run: |
          bash scripts/static-check.sh dist/bin/telltale-linux-amd64
          bash scripts/static-check.sh dist/bin/telltale-linux-arm64
