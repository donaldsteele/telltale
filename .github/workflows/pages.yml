name: pages

# The project site (site/), with real reports: scripts/site-reports.sh runs
# the lab's scenario machines (Docker, which the runner has) with telltale
# built from the commit and writes their reports into site/reports/. It
# fails if any report is missing, if a link in the site leads nowhere, or if
# anything that identifies the computer that made the reports got into
# them.
#
# Only a release tag (vX.Y.Z) publishes the site, so the reports are always
# the release's telltale; the reports page names the build. A push to main
# runs the same build and checks as a test, and publishes nothing. The
# github-pages environment needs a deployment rule for v* tags (by default
# it allows only the default branch).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; the comment names the
# version each SHA is.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, for the version the reports name
      # No cache: what this job builds is published.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: reports from the lab
        env:
          SITE_SCREENSHOTS: require
        run: bash scripts/site-reports.sh

      - name: links and privacy
        run: go run ./tools/linkcheck site

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # Releases only: between releases the site keeps the last release's
    # reports.
    if: startsWith(github.ref, 'refs/tags/v')
    # One deployment at a time; a newer one waits rather than cutting one
    # off.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may deploy.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
