{{define "content"}}
<section class="narrow">
<h1>Log in</h1>
{{if .Body.Changed}}<p class="flash" role="status">Your password was changed and every session was ended. Log in with the new password.</p>{{end}}
<form method="post" action="/login" class="stack">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="text" name="username" value="admin" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true" readonly>
<label for="password">Admin password</label>
<input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
<button type="submit" class="btn primary">Log in</button>
</form>
<p class="small dim">After five wrong passwords from one address, logins from it are refused for a minute.</p>
</section>
{{end}}
